    </div>`;
  }

  function todoRow(x, { planned = false } = {}) {
    const g = x.goalId && goalById(x.goalId);
    const subDone = x.subtasks.filter((s) => s.done).length;
    const open = ui.todo === x.id && !planned;
    // Subtasks are listed under the task for quick ticking; the edit view has its own list.
    const showSubs = x.subtasks.length > 0 && !x.done && !open && !planned;
    const meta = [
      x.done || planned ? "" : dueTag(x.due),
      planned ? `<span class="tag">Geplant</span>` : "",
      x.repeat ? `<span class="tag">↻ ${REPEAT[x.repeat]}</span>` : "",
      x.priority === "hoch" && !x.done ? `<span class="tag prio">Hoch</span>` : "",
      x.priority === "niedrig" && !x.done ? `<span class="tag low">Niedrig</span>` : "",
      x.subtasks.length && !showSubs ? `<span class="tag">${subDone}/${x.subtasks.length}</span>` : "",
      g ? `<span class="tag goal">◎ ${esc(g.title)}</span>` : "",
    ].join("");
    const folded = ui.folded.has(x.id);
    const subsHtml = showSubs ? `<div class="subs-fold">
        <button class="fold-btn" data-act="sub-fold" data-id="${x.id}" aria-expanded="${!folded}">${ICON.next}<span>Unteraufgaben ${subDone}/${x.subtasks.length}</span><span class="mini"><i style="width:${Math.round((subDone / x.subtasks.length) * 100)}%"></i></span></button>
        ${folded ? "" : `<ul class="inline-subs">${x.subtasks.map((s) => `<li class="${s.done ? "done" : ""}">
          ${checkBtn("sub-toggle", s.id, s.done, s.done ? "Wieder öffnen" : "Erledigt", "square")}
          <button class="sub-text" data-act="sub-toggle" data-id="${s.id}">${esc(s.text)}</button>
        </li>`).join("")}</ul>`}
      </div>` : "";
    return `<li class="row-wrap"><div class="row ${x.done ? "done" : ""}">
        ${planned
          ? `<span class="check planned" aria-hidden="true"></span>`
          : checkBtn("todo-toggle", x.id, x.done, x.done ? "Wieder öffnen" : "Erledigt")}
        <button class="body-btn" data-act="open-todo" data-id="${x.id}" aria-expanded="${open}"><span class="title">${esc(x.title)}</span>${meta.trim() ? `<span class="meta">${meta}</span>` : ""}</button>
        ${x.done || planned ? "" : `<button class="star" data-act="star" data-id="${x.id}" aria-pressed="${isStar(x)}" aria-label="${isStar(x) ? "Nicht mehr heute wichtig" : "Heute besonders wichtig"}">${ICON.star}</button>`}
        ${open ? "" : delBtn("todo", x.id, x.title)}
      </div>${subsHtml}${open ? todoDetail(x) : ""}</li>`;
  }

  function addTodoForm(id, due = "") {
    const goalOpts = S.goals.map((g) => `<option value="${g.id}">${esc(g.title)}</option>`).join("");
    return `<form class="add" data-form="todo">
        <input class="field" id="${id}" name="title" placeholder="${due ? "Aufgabe für diesen Tag …" : "Neue Aufgabe …"}" autocomplete="off" enterkeyhint="done" required>
        ${due ? `<input type="hidden" name="due" value="${due}">` : `<button type="button" class="icon-btn" data-act="toggle-opts" aria-expanded="${ui.opts}" aria-label="Datum, Wiederholung, Priorität und Ziel">${ICON.sliders}</button>`}
        <button class="btn" aria-label="Aufgabe hinzufügen">${ICON.plus}</button>
        ${due ? "" : `<div class="opts" ${ui.opts ? "" : "hidden"}>
          ${quickDue("new", "")}
          <label>Fällig am<input class="field" type="date" id="todo-due" name="due"></label>
          <label>Wiederholen<select class="field" id="todo-repeat" name="repeat">${Object.entries(REPEAT).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></label>
          <label>Priorität<select class="field" id="todo-prio" name="priority">${prioOptions("normal")}</select></label>
          <label>Ziel<select class="field" id="todo-goal" name="goalId"><option value="">Kein Ziel</option>${goalOpts}</select></label>
        </div>`}
      </form>`;
  }

  function viewTodos() {
    const t = today();
    const isEmpty = !S.todos.length && !S.lists.length && !S.goals.length && !S.habits.length;
    const open = S.todos.filter((x) => !x.done);
    const due = open.filter((x) => x.due && x.due <= t);
    const done = S.todos.filter((x) => x.done);
    const sets = { open, today: due, done };
    const items = [...sets[ui.filter]].sort(ui.filter === "done" ? (a, b) => (b.doneAt || 0) - (a.doneAt || 0) : sortTodos);

    let html = isEmpty ? "" : backupNudge() + briefing();
    const pins = S.lists.filter((l) => l.pinned);
    if (pins.length) html += `<div class="pinned-row" aria-label="Angepinnte Listen">${pins.map((l) =>
      `<button class="pin-chip" data-act="open-pinned" data-id="${l.id}"><span class="chip-emoji" aria-hidden="true">${esc(listIcon(l))}</span><span>${esc(l.name)}</span><span class="n">${l.items.filter((i) => !i.done).length}</span></button>`).join("")}</div>`;
    html += addTodoForm("todo-title") + `
      <div class="chips" role="group" aria-label="Filter">
        ${[["open", "Offen", open.length], ["today", "Heute fällig", due.length], ["done", "Erledigt", done.length]]
          .map(([k, l, n]) => `<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${ui.filter === k}">${l} <span class="n">${n}</span></button>`).join("")}
      </div>`;

    if (isEmpty) {
      html += `<div class="empty"><strong>Dein Planer ist leer</strong><p>Schreib oben deine erste Aufgabe hinein. Oder lade ein paar Beispiele, um alle Bereiche auszuprobieren.</p><button class="btn ghost small" data-act="examples">Beispiele laden</button></div>`;
    } else if (!items.length) {
      const msg = { open: "Alles erledigt. Gönn dir eine Pause.", today: "Heute ist nichts fällig.", done: "Noch nichts abgehakt." }[ui.filter];
      html += `<div class="empty"><p>${msg}</p></div>`;
    } else {
      const starred = ui.filter === "done" ? [] : items.filter(isStar);
      const rest = items.filter((x) => !starred.includes(x));
      if (starred.length) html += `<p class="group-label">${ICON.star.replace("<svg", '<svg width="14" height="14" style="fill:currentColor"')} Heute besonders wichtig</p><ul class="rows">${starred.map((x) => todoRow(x)).join("")}</ul>`;
      if (rest.length) html += `${starred.length ? `<p class="group-label plain">Weitere Aufgaben</p>` : ""}<ul class="rows">${rest.map((x) => todoRow(x)).join("")}</ul>`;
      if (ui.filter === "done") html += `<div class="actions"><span></span><button class="btn small danger" data-act="clear-done">Erledigte entfernen</button></div>`;
    }
    return html;
  }

  // ---------- views: Kalender ----------
  function viewCalendar() {
    const t = today();
    ui.calMonth = ui.calMonth || t.slice(0, 7);
    ui.calDay = ui.calDay || t;
    const [y, m] = ui.calMonth.split("-").map(Number);
    const first = new Date(y, m - 1, 1);
    const lead = (first.getDay() + 6) % 7;
    const n = daysInMonth(y, m - 1);
    const dows = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
    let cells = dows.map((d) => `<span class="cal-dow">${d}</span>`).join("");
    for (let i = 0; i < lead; i++) cells += `<span class="cal-cell out"></span>`;
    for (let d = 1; d <= n; d++) {
      const k = `${y}-${pad(m)}-${pad(d)}`;
      const dots = [];
      for (const x of S.todos) {
        if (x.done && !x.repeat) { if (x.doneDay === k) dots.push("d"); }
        else if (occursOn(x, k)) dots.push(k < t ? "late" : "");
      }
      const hRatio = S.habits.length ? S.habits.filter((h) => h.log[k]).length / S.habits.length : 0;
      const label = fmt(k, { weekday: "long", day: "numeric", month: "long" }) + (dots.length ? `, ${plural(dots.length, "Aufgabe", "Aufgaben")}` : "");
      cells += `<button class="cal-cell ${k === t ? "is-today" : ""} ${k < t ? "past" : ""}" data-act="cal-day" data-day="${k}" aria-pressed="${k === ui.calDay}" aria-label="${label}">
        <span class="num">${d}</span>
        <span class="dots">${dots.slice(0, 3).map((c) => `<i class="${c}"></i>`).join("")}</span>
        ${S.habits.length && k <= t ? `<span class="hbar"><i style="width:${Math.round(hRatio * 100)}%"></i></span>` : ""}
      </button>`;
    }

    const day = ui.calDay;
    const list = [];
    for (const x of S.todos) {
      if (x.done && !x.repeat) { if (x.doneDay === day) list.push([x, false]); continue; }
      if (occursOn(x, day)) list.push([x, x.due !== day]);
    }
    list.sort((a, b) => (a[0].done - b[0].done) || sortTodos(a[0], b[0]));
    const habitChips = day <= t && S.habits.length
      ? `<p class="section-label">Habits an diesem Tag</p><div class="habit-chips">${S.habits.map((h) => `<button class="habit-chip" data-act="habit-day" data-id="${h.id}" data-day="${day}" aria-pressed="${!!h.log[day]}">${h.log[day] ? "✓ " : ""}${esc(h.name)}</button>`).join("")}</div>`
      : "";

    return `
      <section class="card">
        <div class="cal-head">
          <h2>${first.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</h2>
          <div class="cal-nav">
            <button class="icon-btn" data-act="cal-move" data-n="-1" aria-label="Voriger Monat">${ICON.back}</button>
            <button class="btn small ghost" data-act="cal-today">Heute</button>
            <button class="icon-btn" data-act="cal-move" data-n="1" aria-label="Nächster Monat">${ICON.next}</button>
          </div>
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="legend"><span><i></i>Aufgabe</span><span><i class="late"></i>Überfällig</span>${S.habits.length ? `<span><i class="bar"></i>Habits erledigt</span>` : ""}</div>
      </section>
      <h2>${day === t ? "Heute" : fmt(day, { weekday: "long", day: "numeric", month: "long" })}</h2>
      ${list.length ? `<ul class="rows">${list.map(([x, planned]) => todoRow(x, { planned })).join("")}</ul>` : `<div class="empty"><p>An diesem Tag steht nichts an.</p></div>`}
      ${addTodoForm("cal-todo-title", day)}
      ${habitChips}`;
  }

  // ---------- views: Listen ----------
  // List symbols are emoji: picked from presets (like Apple's Reminders) or typed in.
  // A list without one shows a symbol guessed from its name; new lists store the guess.
  const LIST_ICONS = ["📝", "🛒", "📚", "✈️", "🧳", "🎁", "🏠", "💼", "🎬", "🍳", "💪", "💡", "🎵", "🐾", "💊", "💰", "🎓", "🌱", "❤️", "⭐", "🌸", "🎉", "🧹", "📦"];
  const ICON_GUESS = [
    [/einkauf|supermarkt|lebensmittel|kaufen/i, "🛒"], [/buch|bücher|lesen/i, "📚"], [/pack|koffer/i, "🧳"],
    [/reise|urlaub|trip/i, "✈️"], [/geschenk|geburtstag|wunsch/i, "🎁"], [/haushalt|putz/i, "🧹"],
    [/wohnung|zuhause/i, "🏠"], [/arbeit|job|büro|projekt/i, "💼"], [/film|serie|netflix/i, "🎬"],
    [/rezept|kochen|essen|backen/i, "🍳"], [/sport|training|gym|fitness/i, "💪"], [/idee/i, "💡"],
    [/musik|song|playlist/i, "🎵"], [/hund|katze|tier/i, "🐾"], [/arzt|medizin|gesundheit/i, "💊"],
    [/geld|finanz|budget|sparen/i, "💰"], [/uni|schule|lernen|studium/i, "🎓"], [/garten|pflanze/i, "🌱"],
    [/party|feier/i, "🎉"], [/umzug/i, "📦"],
  ];
  const guessIcon = (name) => (ICON_GUESS.find(([re]) => re.test(name)) || [null, "📝"])[1];
  const listIcon = (l) => l.icon || guessIcon(l.name);
  const firstGrapheme = (s) => {
    s = s.trim();
    if (!s) return "";
    try { return [...new Intl.Segmenter("de", { granularity: "grapheme" }).segment(s)][0].segment; } catch { return [...s][0]; }
  };
  function iconPicker(l) {
    const cur = listIcon(l);
    return `<section class="card" aria-label="Symbol wählen">
      <div class="card-head"><h2>Symbol wählen</h2><button class="del" data-act="icon-picker" aria-label="Symbolauswahl schließen">${ICON.x}</button></div>
      <div class="icon-grid">${LIST_ICONS.map((e) => `<button class="icon-opt" data-act="set-icon" data-v="${e}" aria-pressed="${e === cur}" aria-label="Symbol ${e}">${e}</button>`).join("")}</div>
      <form class="add" data-form="icon">
        <input class="field" id="icon-custom" name="text" placeholder="Eigenes Emoji, z. B. 🧁" autocomplete="off" enterkeyhint="done" required>
        <button class="btn small">Übernehmen</button>
      </form>
      <p class="sub" style="margin:0">Tipp: Auf der iPhone-Tastatur unten links auf 😀 tippen, um ein beliebiges Emoji zu wählen.</p>
    </section>`;
  }

  function viewLists() {
    const list = ui.list && S.lists.find((l) => l.id === ui.list);
    if (!list) {
      ui.list = null;
      let html = `<form class="add" data-form="list">
        <input class="field" id="list-name" name="name" placeholder="Neue Liste, z. B. Einkauf" autocomplete="off" required>
        <button class="btn">${ICON.plus} Liste</button>
      </form>`;
      if (!S.lists.length) return html + `<div class="empty"><strong>Noch keine Listen</strong><p>Einkauf, Bücher, Packliste für den Urlaub: alles, was du sammeln möchtest.</p></div>`;
      const sorted = [...S.lists].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      return html + `<div class="stack">${sorted.map((l) => {
        const done = l.items.filter((i) => i.done).length;
        const pct = l.items.length ? (done / l.items.length) * 100 : 0;
        return `<div class="card list-card ${l.pinned ? "pinned" : ""}">
          <div class="card-head">
            <button class="card-btn" data-act="open-list" data-id="${l.id}">
              <div class="card-head"><span class="title-with-icon"><span class="list-icon" aria-hidden="true">${esc(listIcon(l))}</span><h2>${esc(l.name)}</h2></span><span class="sub">${l.items.length ? `${done} von ${l.items.length}` : "leer"}</span></div>
              <div class="bar"><i style="width:${pct}%"></i></div>
            </button>
            <button class="star" data-act="pin" data-id="${l.id}" aria-pressed="${!!l.pinned}" aria-label="${l.pinned ? "Nicht mehr anpinnen" : "Anpinnen"}" style="${l.pinned ? "color:var(--accent)" : ""}">${ICON.pin}</button>
          </div>
        </div>`;
      }).join("")}</div>`;
    }
    const open = list.items.filter((i) => !i.done), done = list.items.filter((i) => i.done);
    const row = (i) => `<li class="row ${i.done ? "done" : ""}">
      ${checkBtn("item-toggle", i.id, i.done, i.done ? "Wieder öffnen" : "Abhaken", "square")}
      ${textCell("item", i.id, i.text)}
      ${rowTools("item", i.id, i.text)}
    </li>`;
    return `
      <button class="back" data-act="close-list">${ICON.back} Alle Listen</button>
      <div class="list-head">
        <button class="list-icon big" data-act="icon-picker" aria-label="Symbol ändern">${esc(listIcon(list))}</button>
        <div class="list-head-text"><span class="sub">${list.items.length ? `${done.length} von ${list.items.length} erledigt` : "Noch keine Einträge"}</span><button class="link-btn" data-act="icon-picker">Symbol ändern</button></div>
      </div>
      ${ui.iconPicker ? iconPicker(list) : ""}
      ${ui.renaming ? `<form class="title-edit" data-form="rename"><input class="field" id="list-rename" name="name" value="${esc(list.name)}" required><button class="btn">Speichern</button></form>` : ""}
      <form class="add" data-form="item">
        <input class="field" id="item-text" name="text" placeholder="Eintrag hinzufügen …" autocomplete="off" enterkeyhint="done" required>
        <button class="btn" aria-label="Eintrag hinzufügen">${ICON.plus}</button>
      </form>
      ${list.items.length ? `<ul class="rows">${open.map(row).join("")}${done.map(row).join("")}</ul>` : `<div class="empty"><p>Diese Liste ist noch leer.</p></div>`}
      <div class="actions">
        <span class="grp">
          <button class="btn small ghost" data-act="rename">Umbenennen</button>
          <button class="btn small ${list.pinned ? "soft" : "ghost"}" data-act="pin" data-id="${list.id}">${list.pinned ? "Angepinnt" : "Anpinnen"}</button>
        </span>
        <span class="grp">
          ${done.length ? `<button class="btn small ghost" data-act="clear-items">Abgehakte entfernen</button>` : ""}
          ${bigDel("list", list.id, "Liste löschen")}
        </span>
      </div>`;
  }

  // ---------- views: Ziele ----------
  function viewGoals() {
    let html = ui.goalForm
      ? `<form class="card" data-form="goal">
          <h2>Neues Ziel</h2>
          <input class="field" id="goal-title" name="title" placeholder="Was willst du erreichen?" autocomplete="off" required>
          <textarea class="field" id="goal-desc" name="desc" placeholder="Warum ist dir das wichtig? (optional)"></textarea>
          <div class="opts"><label>Zieldatum<input class="field" type="date" id="goal-deadline" name="deadline"></label></div>
          <div class="actions"><button type="button" class="btn ghost small" data-act="goal-form">Abbrechen</button><button class="btn small">Ziel anlegen</button></div>
        </form>`
      : `<button class="btn" data-act="goal-form">${ICON.plus} Neues Ziel</button>`;

    if (!S.goals.length) return html + `<div class="empty"><strong>Noch keine Ziele</strong><p>Leg ein Ziel mit Zieldatum an und zerlege es in Schritte. Aufgaben kannst du einem Ziel zuordnen; sie zählen dann zum Fortschritt.</p></div>`;

    const sorted = [...S.goals].sort((a, b) => (a.deadline || "9999") < (b.deadline || "9999") ? -1 : 1);
    html += `<div class="stack">${sorted.map((g) => {
      const p = goalProgress(g);
      let when = "Kein Zieldatum";
      if (g.deadline) {
        const d = diffDays(today(), g.deadline);
        const date = fmt(g.deadline, { day: "numeric", month: "short", year: "numeric" });
        when = p.pct === 100 && p.total ? `Erreicht · ${date}` : d > 0 ? `Noch ${plural(d, "Tag", "Tage")} · ${date}` : d === 0 ? `Heute fällig · ${date}` : `Zieldatum überschritten · ${date}`;
      }
      const open = ui.goal === g.id;
      let body = "";
      if (open) {
        const ms = g.milestones.map((m) => `<li class="row ${m.done ? "done" : ""}">
          ${checkBtn("ms-toggle", m.id, m.done, m.done ? "Wieder öffnen" : "Erledigt", "square")}
          ${textCell("ms", m.id, m.text)}
          ${rowTools("ms", m.id, m.text)}
        </li>`).join("");
        const linked = p.linked.map((t) => `<li class="row ${t.done ? "done" : ""}">
          ${checkBtn("todo-toggle", t.id, t.done, t.done ? "Wieder öffnen" : "Erledigt")}
          <div class="body"><span class="title">${esc(t.title)}</span>${!t.done && t.due ? `<div class="meta">${dueTag(t.due)}</div>` : ""}</div>
        </li>`).join("");
        body = ui.goalEdit === g.id ? `
          <div class="stack">
            <label class="field-label">Titel<input class="field" id="gedit-title-${g.id}" data-gedit="title" data-id="${g.id}" value="${esc(g.title)}" autocomplete="off"></label>
            <label class="field-label">Beschreibung<textarea class="field" id="gedit-desc-${g.id}" data-gedit="desc" data-id="${g.id}" placeholder="Warum ist dir das wichtig?">${esc(g.desc)}</textarea></label>
            <label class="field-label">Zieldatum<input class="field" type="date" id="gedit-deadline-${g.id}" data-gedit="deadline" data-id="${g.id}" value="${g.deadline}"></label>
            <div class="actions"><span></span><button class="btn small" data-act="goal-edit" data-id="${g.id}">Fertig</button></div>
          </div>` : `
          ${g.desc ? `<p class="desc">${esc(g.desc)}</p>` : ""}
          <p class="section-label">Schritte</p>
          ${ms ? `<ul class="rows inner-rows">${ms}</ul>` : ""}
          <form class="add" data-form="ms" data-id="${g.id}">
            <input class="field" id="ms-text-${g.id}" name="text" placeholder="Schritt hinzufügen …" autocomplete="off" required>
            <button class="btn" aria-label="Schritt hinzufügen">${ICON.plus}</button>
          </form>
          ${linked ? `<p class="section-label">Verknüpfte Aufgaben</p><ul class="rows inner-rows">${linked}</ul>` : ""}
          <div class="actions"><button class="btn small ghost" data-act="goal-edit" data-id="${g.id}">${ICON.pencil} Ziel bearbeiten</button>${bigDel("goal", g.id, "Ziel löschen")}</div>`;
      }
      return `<div class="card">
        <button class="card-btn" data-act="open-goal" data-id="${g.id}" aria-expanded="${open}">
          <div class="card-head"><h2>${esc(g.title)}</h2><span class="pct">${p.pct}%</span></div>
          <div class="bar"><i style="width:${p.pct}%"></i></div>
          <div class="card-head"><span class="sub">${when}</span><span class="sub">${p.total ? `${p.done}/${p.total} Schritte` : "Noch keine Schritte"}</span></div>
        </button>${body}</div>`;
    }).join("")}</div>`;
    return html;
  }

  // ---------- views: Habits ----------
  function viewHabits() {
    let html = `<form class="add" data-form="habit">
      <input class="field" id="habit-name" name="name" placeholder="Neue Gewohnheit, z. B. 10 Min. lesen" autocomplete="off" required>
      <button class="btn">${ICON.plus} Habit</button>
    </form>`;
    if (!S.habits.length) return html + `<div class="empty"><strong>Noch keine Habits</strong><p>Hak jeden Tag ab, was du geschafft hast. Die Serie zählt, wie viele Tage du am Stück dabeigeblieben bist.</p></div>`;
    const t = today();
    const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
    return html + `<div class="stack">${S.habits.map((h) => {
      const s = streak(h);
      return `<div class="card habit">
        <div class="habit-top">
          <div class="body">
            ${editing("habit", h.id) ? inlineEdit("habit", h.id, h.name) : `<h2>${esc(h.name)}</h2>`}
            <span class="streak ${s ? "" : "zero"}">${s ? `🔥 ${plural(s, "Tag", "Tage")} in Folge` : "Noch keine Serie"}</span>
          </div>
          <button class="today-btn" data-act="habit-day" data-id="${h.id}" data-day="${t}" aria-pressed="${!!h.log[t]}" aria-label="Heute erledigt">${ICON.check}</button>
        </div>
        <div class="week">${days.map((d) => `<button class="day ${d === t ? "is-today" : ""}" data-act="habit-day" data-id="${h.id}" data-day="${d}" aria-pressed="${!!h.log[d]}" aria-label="${fmt(d, { weekday: "long", day: "numeric", month: "long" })}">${fmt(d, { weekday: "short" }).replace(".", "")}<i></i></button>`).join("")}</div>
        <div class="habit-foot"><span>${lastN(h, 30)} von 30 Tagen · Rekord ${plural(bestStreak(h), "Tag", "Tage")}</span><span class="grp">${rowTools("habit", h.id, h.name)}</span></div>
      </div>`;
    }).join("")}</div>`;
  }

  // ---------- views: Fortschritt ----------
  function achievements(tot, lv) {
    const best = Math.max(0, ...S.habits.map(bestStreak));
    const goalDone = S.goals.some((g) => { const p = goalProgress(g); return p.total && p.pct === 100; });
    let perfect = false;
    if (S.habits.length >= 2) {
      const days = new Set(S.habits.flatMap((h) => Object.keys(h.log)));
      perfect = [...days].some((d) => S.habits.every((h) => h.log[d]));
    }
    const prog = (v, goal, unit = "") => `${Math.min(v, goal)} / ${goal}${unit}`;
    return [
      ["✓", "Erster Haken", "Eine Aufgabe erledigt", tot.t >= 1, prog(tot.t, 1)],
      ["⚡", "Im Fluss", "25 Aufgaben erledigt", tot.t >= 25, prog(tot.t, 25)],
      ["🚀", "Unaufhaltsam", "100 Aufgaben erledigt", tot.t >= 100, prog(tot.t, 100)],
      ["🔥", "Eine Woche dran", "7 Tage Serie bei einem Habit", best >= 7, prog(best, 7, " Tage")],
      ["🌱", "Gewohnheit sitzt", "30 Tage Serie bei einem Habit", best >= 30, prog(best, 30, " Tage")],
      ["☀️", "Perfekter Tag", "Alle Habits an einem Tag", perfect, S.habits.length >= 2 ? "Noch nicht" : "Ab 2 Habits"],
      ["🎯", "Ziel erreicht", "Ein Ziel zu 100 % geschafft", goalDone, goalDone ? "Geschafft" : "Noch offen"],
      ["⏱", "Konzentriert", "5 Fokus-Sitzungen", tot.fs >= 5, prog(tot.fs, 5)],
      ["🧠", "Tiefenarbeit", "10 Stunden im Fokus", tot.f >= 600, `${Math.min(Math.floor(tot.f / 60), 10)} / 10 Std.`],
      ["🏅", "Level 5", "500 Punkte bis Level 5 sammeln", lv.L >= 5, `Level ${lv.L} / 5`],
    ];
  }

  function weekChart() {
    const t = today();
    const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
    const vals = days.map((d) => (S.stats[d]?.t || 0) + (S.stats[d]?.s || 0) + (S.stats[d]?.m || 0));
    const max = Math.max(4, ...vals);
    const W = 320, H = 150, top = 18, base = 120, bw = 26, gap = (W - bw * 7) / 7;
    const bars = days.map((d, i) => {
      const v = vals[i];
      const h = v ? Math.max(6, ((base - top) * v) / max) : 3;
      const x = gap / 2 + i * (bw + gap), y = base - h;
      const r = Math.min(4, h / 2);
      const path = `M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${base} Z`;
      const label = fmt(d, { weekday: "short" }).replace(".", "");
      return `<g tabindex="0" role="img" aria-label="${fmt(d, { weekday: "long", day: "numeric", month: "long" })}: ${v} erledigt">
        <title>${fmt(d, { weekday: "long", day: "numeric", month: "short" })}: ${v} erledigt</title>
        <rect class="hit" x="${x - gap / 2}" y="0" width="${bw + gap}" height="${H}"/>
        <path class="bar-m ${v ? "" : "zero"}" d="${path}"/>
        ${v ? `<text class="v" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${v}</text>` : ""}
        <text x="${x + bw / 2}" y="${base + 18}" text-anchor="middle" ${d === t ? 'style="fill:var(--ink)"' : ""}>${d === t ? "Heute" : label}</text>
      </g>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" aria-label="Erledigte Aufgaben, Unteraufgaben und Schritte der letzten 7 Tage"><line class="grid" x1="0" x2="${W}" y1="${base + .5}" y2="${base + .5}"/>${bars}</svg>`;
  }

  function viewStats() {
    const tot = totals();
    const xp = xpOf(tot);
    const lv = level(xp);
    const t = today();
    const sumRange = (from, to, key) => { let s = 0; for (let i = from; i <= to; i++) s += S.stats[addDays(t, -i)]?.[key] || 0; return s; };
    const tasksWeek = sumRange(0, 6, "t"), tasksPrev = sumRange(7, 13, "t");
    const delta = tasksWeek - tasksPrev;
    const focusWeek = sumRange(0, 6, "f");
    const habitRate = S.habits.length ? Math.round((S.habits.reduce((s, h) => s + lastN(h, 7), 0) / (S.habits.length * 7)) * 100) : null;
    const best = S.habits.length ? Math.max(...S.habits.map(streak)) : 0;
    const badges = achievements(tot, lv);
    const won = badges.filter((b) => b[3]).length;

    return `
      <section class="card level-card">
        <div class="card-head">
          <div><span class="sub">Dein Level</span><div class="lv">Level ${lv.L}</div></div>
          <div style="text-align:right"><span class="sub">Punkte</span><div class="pct">${xp} XP</div></div>
        </div>
        <div class="bar"><i style="width:${((xp - lv.from) / (lv.to - lv.from)) * 100}%"></i></div>
        <span class="sub">Noch ${lv.to - xp} XP bis Level ${lv.L + 1} · Aufgabe +${XP.t}, Schritt +${XP.m}, Habit +${XP.h}, Fokus-Sitzung +${XP.fs}, Unteraufgabe +${XP.s}</span>
      </section>
      <p class="section-label">Diese Woche</p>
      <div class="tiles">
        <div class="tile"><span class="k">Aufgaben erledigt</span><span class="v">${tasksWeek}</span><span class="d">${delta === 0 ? "wie letzte Woche" : `${delta > 0 ? "+" : "−"}${Math.abs(delta)} zur Vorwoche`}</span></div>
        <div class="tile"><span class="k">Habit-Quote</span><span class="v">${habitRate === null ? "–" : habitRate + " %"}</span><span class="d">letzte 7 Tage</span></div>
        <div class="tile"><span class="k">Im Fokus</span><span class="v">${focusWeek} Min.</span><span class="d">${plural(sumRange(0, 6, "fs"), "Sitzung", "Sitzungen")}</span></div>
        <div class="tile"><span class="k">Längste Serie</span><span class="v">${best} ${best === 1 ? "Tag" : "Tage"}</span><span class="d">aktuell</span></div>
      </div>
      <section class="card chart">
        <h2>Erledigt pro Tag</h2>
        ${weekChart()}
        <span class="sub">Aufgaben, Unteraufgaben und Ziel-Schritte zusammen</span>
      </section>
      <p class="section-label">Erfolge · ${won} von ${badges.length}</p>
      <div class="badges">${badges.map(([ico, title, desc, ok, p]) => `<div class="badge ${ok ? "" : "locked"}"><span class="ico" aria-hidden="true">${ico}</span><div><span class="t">${title}</span><span class="s">${desc}</span><span class="s">${ok ? "Freigeschaltet" : p}</span></div></div>`).join("")}</div>`;
  }

  // ---------- render ----------
  const TITLES = { todos: "To-Dos", calendar: "Kalender", lists: "Listen", goals: "Ziele", habits: "Habits", stats: "Fortschritt" };
  function summary() {
    const t = today();
    if (ui.tab === "todos") {
      const open = S.todos.filter((x) => !x.done);
      const late = open.filter((x) => x.due && x.due < t).length;
      const dueToday = open.filter((x) => x.due === t).length;
      return plural(open.length, "offene Aufgabe", "offene Aufgaben") + (dueToday ? ` · ${dueToday} heute fällig` : "") + (late ? ` · ${late} überfällig` : "");
    }
    if (ui.tab === "calendar") return "Tippe auf einen Tag, um zu sehen, was ansteht";
    if (ui.tab === "lists") return plural(S.lists.length, "Liste", "Listen");
    if (ui.tab === "goals") {
      if (!S.goals.length) return "Wohin soll es gehen?";
      const avg = Math.round(S.goals.reduce((s, g) => s + goalProgress(g).pct, 0) / S.goals.length);
      return `${plural(S.goals.length, "Ziel", "Ziele")} · im Schnitt ${avg} % geschafft`;
    }
    if (ui.tab === "stats") return "Woche, Level und Erfolge";
    const done = S.habits.filter((h) => h.log[t]).length;
    return S.habits.length ? `Heute ${done} von ${S.habits.length} erledigt` : "Kleine Schritte, jeden Tag";
  }

  // ---------- theme ----------
  const THEMES = { system: "Automatisch", light: "Hell", dark: "Dunkel" };
  let theme = "system";
  try { theme = localStorage.getItem(KEY + ":theme") || "system"; } catch {}
  function applyTheme() {
    if (!THEMES[theme]) theme = "system";
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
  }

  // Accent colour: [name, light-mode value, dark-mode value]. A custom hex derives both variants.
  const ACCENTS = {
    pink: ["Pink", "#C2307A", "#F27AB5"],
    lila: ["Lila", "#7646D6", "#B59BFF"],
    blau: ["Blau", "#2563EB", "#80A9FF"],
    tuerkis: ["Türkis", "#0A7F9F", "#4CC2DF"],
    gruen: ["Grün", "#2D7A4D", "#6FCB95"],
    graphit: ["Graphit", "#3E4A57", "#B8C4D0"],
  };
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => "#" + rgb(a).map((v, i) => Math.round(v + (rgb(b)[i] - v) * t).toString(16).padStart(2, "0")).join("");
  const lum = (h) => {
    const [r, g, b] = rgb(h).map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
    return .2126 * r + .7152 * g + .0722 * b;
  };
  function accentPair(a) {
    if (ACCENTS[a]) return ACCENTS[a].slice(1);
    if (!/^#[0-9a-f]{6}$/i.test(a || "")) return ACCENTS.pink.slice(1);
    // Keep text on white readable in light mode and lift the colour so it glows on dark.
    let light = a; while (lum(light) > .2) light = mix(light, "#000000", .12);
    let dark = a; while (lum(dark) < .32) dark = mix(dark, "#FFFFFF", .12);
    return [light, dark];
  }
  // Set through the CSSOM on <html>: the viewer's content policy may drop injected <style> blocks,
  // but never script-set style properties. The value picked follows the theme actually showing.
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => {
    const t = document.documentElement.getAttribute("data-theme");
    return t === "dark" || (t !== "light" && darkMQ.matches);
  };
  let shownAccent = null;
  function applyAccent(a = ui.pendingAccent || S.prefs.accent) {
    shownAccent = a;
    const [l, d] = accentPair(a);
    const dark = isDark();
    const c = dark ? d : l;
    const root = document.documentElement.style;
    root.setProperty("--accent", c);
    root.setProperty("--accent-soft", dark ? mix(c, "#0C131A", .78) : mix(c, "#FFFFFF", .88));
    root.setProperty("--accent-ink", lum(c) > .4 ? (dark ? mix(c, "#000000", .82) : "#132130") : "#FFFFFF");
  }
  try { darkMQ.addEventListener("change", () => applyAccent(shownAccent || undefined)); } catch {}
  new MutationObserver(() => applyAccent(shownAccent || undefined)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  function hslHex(h, s, l = 50) {
    s /= 100; l /= 100;
    const f = (n) => { const k = (n + h / 30) % 12; const c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, "0"); };
    return "#" + f(0) + f(8) + f(4);
  }
  function hexHue(hex) {
    const [r, g, b] = rgb(hex).map((v) => v / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (!d) return { h: 330, s: 15 };
    const h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    const l = (max + min) / 2;
    return { h: Math.round((h * 60 + 360) % 360), s: Math.max(15, Math.round((d / (1 - Math.abs(2 * l - 1))) * 100)) };
  }
  // Shows a not-yet-saved colour everywhere at once, without re-rendering (keeps the slider under the finger).
  function previewAccent(hex) {
    ui.pendingAccent = hex;
    applyAccent(hex);
    $("#custom-dot")?.style.setProperty("--sw", hex);
    $("#sat")?.style.setProperty("--h", ui.custom.h);
    const btn = $("#accent-apply");
    if (btn) { btn.disabled = false; btn.style.opacity = ""; }
  }

  function designPanel() {
    const cur = S.prefs.accent;
    if (!ui.custom) ui.custom = hexHue(accentPair(cur)[0]);
    const custom = !ACCENTS[cur];
    const tick = ICON.check;
    return `<section class="card" aria-label="Design">
      <div class="card-head"><h2>Design</h2><button class="del" data-act="design" aria-label="Design schließen">${ICON.x}</button></div>
      <p class="section-label">Darstellung</p>
      <div class="chips">${Object.entries(THEMES).map(([k, l]) => `<button class="chip" data-act="theme-set" data-v="${k}" aria-pressed="${theme === k}">${l}</button>`).join("")}</div>
      <p class="section-label">Akzentfarbe</p>
      <div class="swatches">
        ${Object.entries(ACCENTS).map(([k, [name, l]]) => `<button class="swatch" data-act="accent" data-v="${k}" aria-pressed="${cur === k}" style="--sw:${l}"><i>${tick}</i>${name}</button>`).join("")}
        ${custom ? `<button class="swatch" data-act="accent" data-v="${cur}" aria-pressed="true" style="--sw:${accentPair(cur)[0]}"><i>${tick}</i>Eigene</button>` : ""}
      </div>
      <p class="section-label">Eigene Farbe</p>
      <div class="custom">
        <span class="custom-dot" id="custom-dot" style="--sw:${hslHex(ui.custom.h, ui.custom.s)}"></span>
        <div class="sliders">
          <label for="hue">Farbton<input class="range hue" type="range" id="hue" min="0" max="359" value="${ui.custom.h}"></label>
          <label for="sat">Kräftigkeit<input class="range sat" type="range" id="sat" min="15" max="100" value="${ui.custom.s}" style="--h:${ui.custom.h}"></label>
        </div>
      </div>
      <div class="actions">
        <label class="btn small ghost picker">iPhone-Farbwähler<input type="color" id="accent-custom" value="${hslHex(ui.custom.h, ui.custom.s)}" aria-label="iPhone-Farbwähler öffnen"></label>
        <button class="btn small" data-act="accent-apply" ${ui.pendingAccent ? "" : "disabled style=\"opacity:.45\""} id="accent-apply">Farbe übernehmen</button>
      </div>
      <div class="preview" aria-hidden="true">${LOGO(44)}<span class="check" aria-pressed="true" style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)">${tick}</span><div class="bar"><i style="width:62%"></i></div><span class="tag goal">◎ Ziel</span></div>
      <p class="section-label">Daten & Backup</p>
      <p class="sub" style="margin:0">Kopiere ein Backup, um deine Daten zu sichern oder in eine andere Bloom-Version zu übertragen. Beim Importieren werden die aktuellen Daten ersetzt.</p>
      <div class="actions"><span class="grp">
        <button class="btn small ghost" data-act="backup-copy">Backup kopieren</button>
        ${STANDALONE ? `<button class="btn small ghost" data-act="backup-file">Als Datei sichern</button>` : ""}
      </span></div>
      ${ui.backupText ? `<label class="field-label">Dein Backup: alles markieren und kopieren<textarea class="field" id="backup-out" readonly>${esc(ui.backupText)}</textarea></label>` : ""}
      <label class="field-label">Backup einfügen<textarea class="field" id="backup-in" placeholder="Backup hier einfügen …">${esc(ui.backupIn || "")}</textarea></label>
      <div class="actions">

  // ---------- backup ----------

  function backupNudge() {
    if (!STANDALONE) return "";

    try {
      last = Number(localStorage.getItem(KEY + ":lastBackup")) || 0;
      first = Number(localStorage.getItem(KEY + ":firstUse")) || 0;
      snooze = localStorage.getItem(KEY + ":backupSnooze") || "";
      if (!first) { first = Date.now(); localStorage.setItem(KEY + ":firstUse", String(first)); }
    } catch { return ""; }
    const days = Math.floor((Date.now() - (last || first)) / 864e5);
    if (days < BACKUP_EVERY_DAYS || snooze === today()) return "";
    return `<section class="card nudge" aria-label="Backup-Erinnerung">
      <h2>Zeit für ein Backup</h2>
      <p class="sub">${last ? `Dein letztes Backup ist ${days} Tage her.` : "Du hast noch kein Backup gemacht."} Deine Daten liegen nur auf diesem iPhone. Sichere sie z. B. in iCloud Drive.</p>

  function commit() {

  const saveF = () => { try { F ? localStorage.setItem(KEY + ":focus", JSON.stringify(F)) : localStorage.removeItem(KEY + ":focus"); } catch {} };
  const remaining = () => (F.end ? Math.max(0, F.end - Date.now()) : F.left);

  function focusOpen(taskId) { F = { taskId: taskId || "", dur: F?.dur || 25, end: null, left: (F?.dur || 25) * 60000, phase: "setup" }; saveF(); drawFocus(); }

  function focusFinish() {

    const el = $("#focus");

      return;
    }

      el.innerHTML = `${head}
        <svg class="focus-ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="5"/><circle class="val" cx="50" cy="50" r="44" fill="none" stroke-width="5"/><text x="50" y="56" text-anchor="middle">${ICON_DONE}</text></svg>

      return;
    }
    const C = 276.5;
    el.innerHTML = `${head}
      <svg class="focus-ring" viewBox="0 0 100 100" role="timer" aria-live="off">
        <circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="5"/>

      </svg>

    const update = () => {
      const ms = remaining();
      const s = Math.ceil(ms / 1000);
      $("#f-time").textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
      $("#f-val").setAttribute("stroke-dashoffset", String(C * (1 - ms / (F.dur * 60000))));

      ui.custom[el.id === "hue" ? "h" : "s"] = Number(el.value);
      previewAccent(hslHex(ui.custom.h, ui.custom.s));
      return true;
    }
    if (el.id === "accent-custom") {
      ui.custom = hexHue(el.value);
      const h = $("#hue"), s = $("#sat");
      if (h) h.value = ui.custom.h;
      if (s) s.value = ui.custom.s;
      previewAccent(el.value.toLowerCase());
      return true;
    }
    return false;
  }
  document.addEventListener("input", (e) => {
    if (e.target.id === "backup-in") ui.backupIn = e.target.value;
    else if (e.target.id === "todo-due") markQuick(e.target.closest(".opts")?.querySelector(".quick"), e.target.value);
    else onColourInput(e.target);
  });

  document.addEventListener("change", (e) => {
    if (onColourInput(e.target)) return;
    if (e.target.id === "backup-file") {
      const f = e.target.files?.[0];
      if (f) f.text().then((t) => { const box = $("#backup-in"); ui.backupIn = t; if (box) box.value = t; toast("Datei geladen, jetzt auf „Backup importieren“ tippen"); });
      return;
    }
    const ge = e.target.closest("[data-gedit]");
    if (ge) {
      const g = goalById(ge.dataset.id), k = ge.dataset.gedit;
      if (!g) return;
      if (k === "title" && !ge.value.trim()) return render();
      return change(() => { g[k] = k === "deadline" ? ge.value : ge.value.trim(); });
    }
    const el = e.target.closest("[data-edit]");
    if (!el) return;
    const t = findTodo(el.dataset.id);
    if (!t) return;
    const k = el.dataset.edit;
    if (k === "title" && !el.value.trim()) return render();
    change(() => {
      if (k === "title") { t.title = el.value.trim(); return; }
      t[k] = el.value;
      if (k === "repeat" && t.repeat && !t.due) t.due = today();
      if ((k === "due" || k === "repeat") && t.due) t.repeatDay = parse(t.due).getDate();
    });
  });

  document.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    const v = Object.fromEntries(new FormData(f));
    const text = (v.title ?? v.name ?? v.text ?? "").trim();
    if (!text) return;
    const kind = f.dataset.form;
    let refocus = null;
    change(() => {
      if (kind === "todo") {
        const repeat = v.repeat || "";
        const due = v.due || (repeat ? today() : "");
        S.todos.push({ id: newId(), title: text, done: false, due, priority: v.priority || "normal", goalId: v.goalId || "", repeat, repeatDay: due ? parse(due).getDate() : 0, subtasks: [] });
        if (ui.filter === "done") ui.filter = "open";
        refocus = ui.tab === "calendar" ? "#cal-todo-title" : "#todo-title";
      }
      if (kind === "sub") { findTodo(f.dataset.id)?.subtasks.push({ id: newId(), text, done: false }); refocus = "#sub-text-" + f.dataset.id; }
      if (kind === "list") { const l = { id: newId(), name: text, icon: guessIcon(text), items: [] }; S.lists.push(l); ui.list = l.id; ui.iconPicker = true; }
      if (kind === "icon") { const l = curList(); if (l) l.icon = firstGrapheme(text); ui.iconPicker = false; return "Symbol geändert"; }
      if (kind === "item") { curList()?.items.push({ id: newId(), text, done: false }); refocus = "#item-text"; }
      if (kind === "rename") { const l = curList(); if (l) l.name = text; ui.renaming = false; }
      if (kind === "goal") {
        const g = { id: newId(), title: text, desc: (v.desc || "").trim(), deadline: v.deadline || "", milestones: [] };
        S.goals.push(g); ui.goalForm = false; ui.goal = g.id; refocus = "#ms-text-" + g.id;
      }
      if (kind === "ms") { goalById(f.dataset.id)?.milestones.push({ id: newId(), text, done: false }); refocus = "#ms-text-" + f.dataset.id; }
      if (kind === "habit") { S.habits.push({ id: newId(), name: text, log: {} }); refocus = "#habit-name"; }
      if (kind === "edit") {
        const k = f.dataset.kind, id = f.dataset.id;
        if (k === "item") { const i = curList()?.items.find((x) => x.id === id); if (i) i.text = text; }
        if (k === "sub") { const [, s] = findSub(id); if (s) s.text = text; }
        if (k === "ms") S.goals.forEach((g) => g.milestones.forEach((m) => m.id === id && (m.text = text)));
        if (k === "habit") { const h = S.habits.find((x) => x.id === id); if (h) h.name = text; }
        ui.editing = null;
        return "Gespeichert";
      }
    });
    if (refocus) $(refocus)?.focus();
  });

  // Roll the date over if the app stays open past midnight; resume the focus ring when coming back.
  let shown = today();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (today() !== shown) { shown = today(); render(); }
    if (F && F.phase === "run") { if (F.end) lockScreen(); drawFocus(); }
  });

  applyTheme();
  render();
  drawFocus();
  setSync("local");
  // Offline support and protection against the browser clearing saved data.
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  try { navigator.storage?.persist?.(); } catch {}
})();
</script>
</body>
</html>
