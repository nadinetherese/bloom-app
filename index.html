<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom</title>
<meta name="description" content="Bloom – dein persönlicher Planer für To-Dos, Listen, Ziele und Habits.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm phone column, cool slate neutrals with a single teal-cyan accent,
   a quiet progress ring in the header, thumb-reach tab bar fixed at the bottom. */
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --ink: #132130;
  --muted: #5D6C7A;
  --line: #E0E6EC;
  --accent: #C2307A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE4EF;
  --sun: #B9720A;
  --sun-soft: #FAEFD9;
  --danger: #C2410C;
  --danger-soft: #FCE8DC;
  --overlay: rgba(19, 33, 48, .5);
  --shadow: 0 1px 2px rgba(19, 33, 48, .05), 0 6px 18px rgba(19, 33, 48, .05);
  --font-display: "Sora", "Avenir Next", system-ui, sans-serif;
  --font-body: "Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  --radius: 16px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C131A; --surface: #141E27; --ink: #E3EBF1; --muted: #8C9CA9; --line: #243340;
    --accent: #F27AB5; --accent-ink: #2A0A1A; --accent-soft: #3A1528;
    --sun: #F0B44A; --sun-soft: #372A14; --danger: #F2905E; --danger-soft: #3A2218;
    --overlay: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C131A; --surface: #141E27; --ink: #E3EBF1; --muted: #8C9CA9; --line: #243340;
  --accent: #F27AB5; --accent-ink: #2A0A1A; --accent-soft: #3A1528;
  --sun: #F0B44A; --sun-soft: #372A14; --danger: #F2905E; --danger-soft: #3A2218;
  --overlay: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app {
  max-width: 560px;
  margin: 0 auto;
  padding-block: calc(36px + env(safe-area-inset-top, 0px)) calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 18px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.top-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }
.brand { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: -.01em; }
.logo-slot { display: inline-flex; }
.logo { flex: none; display: block; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.2; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.summary { color: var(--muted); font-size: 15px; margin: 0; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--accent); }
.sync[data-s="saving"]::before { background: var(--sun); }
.sync[data-s="err"]::before, .sync[data-s="full"]::before { background: var(--danger); }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.theme-btn {
  height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); font-size: 12.5px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 6px;
}
.theme-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.theme-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
.swatch {
  border: 0; background: transparent; padding: 4px 0; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
}
.swatch i { width: 38px; height: 38px; border-radius: 50%; background: var(--sw); display: grid; place-items: center; color: #fff; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.swatch i svg { width: 18px; height: 18px; opacity: 0; }
.swatch[aria-pressed="true"] { color: var(--ink); }
.swatch[aria-pressed="true"] i { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--sw); }
.swatch[aria-pressed="true"] i svg { opacity: 1; }
.custom { display: flex; align-items: center; gap: 14px; }
.custom-dot { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.sliders { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.sliders label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; border-radius: 999px; margin: 0; border: 1px solid var(--line); }
.range.hue { background: linear-gradient(90deg, #e33, #e9e933, #3e3, #3ee9e9, #33e, #e933e9, #e33); }
.range.sat { background: linear-gradient(90deg, hsl(var(--h, 330), 15%, 50%), hsl(var(--h, 330), 100%, 50%)); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid #132130; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid #132130; }
.picker { position: relative; overflow: hidden; }
.picker input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.preview { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.preview .bar { flex: 1 1 120px; }

.ring-btn { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 12px; padding: 4px; }
.ring-btn:focus-visible { outline: 2px solid var(--accent); }
.ring { width: 70px; height: 70px; }
.ring .track { stroke: var(--accent-soft); }
.ring .val { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
.ring text { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 21px; }
.ring .lbl { fill: var(--muted); font-family: var(--font-body); font-size: 10px; font-weight: 600; }
.lvl { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }

/* Forms */
.add { display: flex; flex-wrap: wrap; gap: 8px; }
.field {
  flex: 1 1 200px; min-width: 0;
  height: 48px; padding: 0 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  font-size: 16px;
}
.field:focus { border-color: var(--accent); outline: none; }
textarea.field { height: auto; min-height: 76px; padding: 12px 14px; resize: vertical; flex-basis: 100%; }
.field::placeholder { color: var(--muted); }
.btn {
  height: 48px; padding: 0 18px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.small { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: #fff; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: inline-grid; place-items: center; color: var(--muted);
}
.icon-btn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
.opts { flex-basis: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opts label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.opts .field { flex: none; width: 100%; height: 44px; font-weight: 500; color: var(--ink); font-size: 15px; }
/* iOS gives date inputs an intrinsic width wider than a half-width column; reset it so all fields line up. */
input[type="date"].field { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; line-height: 42px; text-align: left; }
input[type="date"].field::-webkit-date-and-time-value { text-align: left; }
.quick { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.quick .chip { height: 32px; padding: 0 12px; font-size: 13px; }

/* Chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 14px; font-weight: 600; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
}
.chip .n { font-variant-numeric: tabular-nums; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Rows */
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row-wrap { border-top: 1px solid var(--line); }
.row-wrap:first-child { border-top: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 12px; min-height: 58px; }
.rows > .row { border-top: 1px solid var(--line); }
.rows > .row:first-child { border-top: 0; }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.body-btn { all: unset; cursor: pointer; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; border-radius: 6px; }
.body-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row .title { overflow-wrap: anywhere; }
.row.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--bg); font-weight: 600; font-variant-numeric: tabular-nums; }
.tag.late { background: var(--danger-soft); color: var(--danger); }
.tag.today { background: var(--sun-soft); color: var(--sun); }
.tag.prio { background: var(--danger-soft); color: var(--danger); }
.tag.goal, .tag.win { background: var(--accent-soft); color: var(--accent); }

.check {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; color: transparent; padding: 0;
  transition: background .15s, border-color .15s;
}
.check svg { width: 15px; height: 15px; }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check.square { border-radius: 7px; width: 24px; height: 24px; }
.check.planned { border-style: dashed; cursor: default; }

.del {
  flex: none; height: 36px; min-width: 36px; padding: 0 8px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 700;
}
.del svg { width: 16px; height: 16px; }
.del.armed { background: var(--danger); color: #fff; padding: 0 12px; }
.star { flex: none; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
.star svg { width: 19px; height: 19px; }
.star[aria-pressed="true"] { color: var(--sun); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.tag.low { color: var(--muted); }
.grp { display: flex; gap: 4px; align-items: center; }
.inline-edit { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.inline-edit .field { flex: 1 1 100%; height: 42px; }
.field-label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.field-label .field { flex: none; width: 100%; color: var(--ink); font-weight: 500; }
.detail > .field-label .field { height: 44px; }
.btn svg { flex: none; }
.tag.star-tag { background: var(--sun-soft); color: var(--sun); }
.group-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--sun); margin: 4px 0 -6px; }
.group-label.plain { color: var(--muted); }
.list-card .card-head { align-items: center; }
.list-icon {
  flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft);
  display: grid; place-items: center; font-size: 18px; line-height: 1;
}
.list-icon.big { width: 58px; height: 58px; font-size: 30px; border: 0; padding: 0; cursor: pointer; }
.title-with-icon { display: flex; align-items: center; gap: 10px; min-width: 0; }
.list-head { display: flex; align-items: center; gap: 14px; }
.list-head-text { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.link-btn { all: unset; cursor: pointer; color: var(--accent); font-weight: 700; font-size: 14px; border-radius: 4px; }
.link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.icon-opt { aspect-ratio: 1; width: 100%; border: 0; border-radius: 50%; background: var(--bg); font-size: 22px; line-height: 1; display: grid; place-items: center; padding: 0; }
.icon-opt[aria-pressed="true"] { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
.chip-emoji { flex: none; font-size: 16px; line-height: 1; }
.list-card .card-btn { flex: 1; min-width: 0; }
.list-card.pinned { box-shadow: var(--shadow), inset 3px 0 0 var(--accent); }
.pinned-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.pinned-row::-webkit-scrollbar { display: none; }
.pin-chip {
  flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; max-width: 220px;
}
.pin-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin-chip svg { flex: none; width: 15px; height: 15px; color: var(--accent); }
.pin-chip .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

/* Expanded task */
.detail { padding: 0 12px 14px 52px; display: flex; flex-direction: column; gap: 10px; }
.sub-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
/* Subtasks shown under a task in the overview */
.subs-fold { padding: 0 12px 10px 52px; margin-top: -6px; display: flex; flex-direction: column; gap: 2px; }
.fold-btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 30px; font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; border-radius: 6px; }
.fold-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fold-btn svg { width: 14px; height: 14px; transition: transform .15s ease; }
.fold-btn[aria-expanded="true"] svg { transform: rotate(90deg); }
.fold-btn .mini { width: 44px; height: 4px; border-radius: 2px; background: var(--accent-soft); overflow: hidden; }
.fold-btn .mini i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.inline-subs { list-style: none; margin: 0; padding: 0 0 0 12px; border-left: 2px solid var(--line); display: flex; flex-direction: column; }
.inline-subs li { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.inline-subs .check.square { width: 22px; height: 22px; }
.inline-subs .check svg { width: 13px; height: 13px; }
.sub-text { all: unset; cursor: pointer; flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; padding-block: 6px; }
.sub-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.inline-subs li.done .sub-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.sub-rows .row { min-height: 44px; padding: 4px 0; gap: 10px; }
.detail .add .field { height: 42px; flex-basis: 150px; }
.detail .add .btn { height: 42px; }

.empty {
  background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 28px 20px; text-align: center; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty strong { color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.empty p { margin: 0; max-width: 34ch; }

/* Cards */
.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-btn { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.card-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-head h2 { min-width: 0; overflow-wrap: anywhere; }
.sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
.pct { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--accent); }
.section-label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -4px; }
.desc { margin: 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.inner-rows { border: 1px solid var(--line); box-shadow: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.actions .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.back { all: unset; cursor: pointer; color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; }
.title-edit { display: flex; gap: 8px; }

/* Briefing */
.brief { background: var(--accent-soft); box-shadow: none; gap: 10px; }
.nudge { background: var(--sun-soft); box-shadow: none; gap: 8px; }
.nudge p { margin: 0; }
.brief h2 { color: var(--ink); }
.brief ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.brief li { display: grid; grid-template-columns: 74px 1fr; gap: 8px; font-size: 15px; }
.brief li b { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); padding-top: 2px; }

/* Habits */
.habit { gap: 14px; }
.habit-top { display: flex; align-items: center; gap: 12px; }
.habit-top .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.habit-top h2 { overflow-wrap: anywhere; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: var(--sun); font-variant-numeric: tabular-nums; }
.streak.zero { color: var(--muted); font-weight: 500; }
.today-btn {
  flex: none; width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--line);
  background: transparent; display: grid; place-items: center; color: var(--muted);
}
.today-btn svg { width: 24px; height: 24px; }
.today-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day {
  border: 0; background: transparent; padding: 4px 0; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 600; color: var(--muted);
}
.day i { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line); display: block; }
.day[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); }
.day.is-today { color: var(--ink); }
.day.is-today i { border-color: var(--ink); }
.habit-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h2 { text-transform: capitalize; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav .icon-btn { width: 40px; height: 40px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cal-cell {
  border: 0; background: transparent; border-radius: 10px; padding: 6px 0 5px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px;
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px;
}
.cal-cell.out { visibility: hidden; }
.cal-cell.is-today .num { background: var(--ink); color: var(--bg); }
.cal-cell[aria-pressed="true"] { background: var(--accent-soft); }
.cal-cell .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.cal-cell.past .num { color: var(--muted); }
.dots { display: flex; gap: 3px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.dots i.d { background: var(--line); }
.dots i.late { background: var(--danger); }
.hbar { width: 22px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.hbar > i { display: block; height: 100%; background: var(--sun); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.legend i.late { background: var(--danger); }
.legend i.bar { width: 16px; height: 3px; border-radius: 2px; background: var(--sun); }
.habit-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.habit-chip { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--muted); }
.habit-chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.tile .v { font-family: var(--font-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); }
.chart .bar-m { fill: var(--accent); }
.chart .bar-m.today { fill: var(--accent); }
.chart .bar-m.zero { fill: var(--line); }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart text.v { fill: var(--ink); font-weight: 700; }
.chart .hit { fill: transparent; }
.chart .hit:hover + .bar-m, .chart g:focus .bar-m { opacity: .8; }
.level-card .lv { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.badge { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.badge .ico { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; background: var(--accent-soft); }
.badge.locked .ico { background: var(--bg); filter: grayscale(1); opacity: .55; }
.badge .t { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.badge .s { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge.locked .t { color: var(--muted); }
.badge > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* Focus overlay */
.focus {
  position: fixed; inset: 0; z-index: 40; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  text-align: center;
}
.focus .eyebrow { text-transform: uppercase; letter-spacing: .1em; }
.focus h2 { font-size: 22px; max-width: 28ch; overflow-wrap: anywhere; }
.focus-ring { width: min(72vw, 280px); height: auto; }
.focus-ring .track { stroke: var(--accent-soft); }
.focus-ring .val { stroke: var(--accent); }
.focus-ring text { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.focus-ring .lbl { fill: var(--muted); font-family: var(--font-body); font-size: 8px; font-weight: 600; }
.focus .row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.focus .presets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow);
}

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(4px, env(safe-area-inset-left, 0px));
  padding-right: max(4px, env(safe-area-inset-right, 0px));
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 700;
}
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--accent); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-text">
      <span class="eyebrow brand"><span class="logo-slot" aria-hidden="true"></span><b>Bloom</b><span id="today-label"></span></span>
      <h1 id="page-title">To-Dos</h1>
      <p class="summary" id="summary"></p>
      <div class="meta-row">
        <span class="sync" id="sync" data-s="local">Lädt …</span>
        <button class="theme-btn" id="theme-btn" data-act="design" aria-expanded="false" aria-label="Farben und Darstellung anpassen"><i class="dot"></i>Design</button>
      </div>
    </div>
    <button class="ring-btn" data-act="tab" data-tab="stats" aria-label="Fortschritt und Erfolge öffnen">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="42" fill="none" stroke-width="8"/>
        <circle class="val" id="ring-val" cx="50" cy="50" r="42" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9" transform="rotate(-90 50 50)"/>
        <text id="ring-pct" x="50" y="54" text-anchor="middle">0%</text>

  </header>
  <main id="main" class="stack"></main>
</div>

<div class="focus" id="focus" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<div class="tabbar">
  <nav aria-label="Bereiche">
    <button class="tab" data-act="tab" data-tab="todos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
      To-Dos
    </button>
    <button class="tab" data-act="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/><circle cx="8.5" cy="14" r=".8" fill="currentColor"/><circle cx="12" cy="14" r=".8" fill="currentColor"/><circle cx="15.5" cy="14" r=".8" fill="currentColor"/></svg>
      Kalender
    </button>
    <button class="tab" data-act="tab" data-tab="lists">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>
      Listen
    </button>
    <button class="tab" data-act="tab" data-tab="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
      Ziele
    </button>
    <button class="tab" data-act="tab" data-tab="habits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1-4 2.5-5.5.5 2 1.5 3 2.5 3 0-2.5-.5-5 0-7.5z"/></svg>
      Habits
    </button>
  </nav>
</div>

<script>
(() => {
  const KEY = "tagwerk-planer-v1";
  const STANDALONE = true; // self-hosted copy: data stays on this device, no claude.ai account sync
  const blank = () => ({ todos: [], lists: [], goals: [], habits: [], stats: {}, prefs: { accent: "pink" }, updated: 0 });
  function normalize(s) {
    s = { ...blank(), ...s };
    s.stats = s.stats || {};
    s.prefs = { accent: "pink", ...(s.prefs || {}) };
    s.todos = s.todos.map((t) => ({ repeat: "", subtasks: [], priority: "normal", goalId: "", due: "", ...t }));
    s.goals = s.goals.map((g) => ({ milestones: [], desc: "", deadline: "", ...g }));
    s.habits = s.habits.map((h) => ({ log: {}, ...h }));
    s.lists = s.lists.map((l) => ({ items: [], ...l }));
    return s;
  }
  let S = blank();
  const ui = {
    tab: "todos", filter: "open", list: null, goal: null, todo: null, opts: false, goalForm: false, renaming: false, arm: null,
    calMonth: null, calDay: null,
  };

  try { const raw = localStorage.getItem(KEY); if (raw) S = normalize(JSON.parse(raw)); } catch {}
  try { const t = localStorage.getItem(KEY + ":tab"); if (t) ui.tab = t; } catch {}
  // Tasks whose subtask list is collapsed in the overview (open is the default).
  ui.folded = new Set();
  try { ui.folded = new Set(JSON.parse(localStorage.getItem(KEY + ":folded") || "[]")); } catch {}

  // ---------- helpers ----------
  const $ = (s) => document.querySelector(s);
  const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const pad = (n) => String(n).padStart(2, "0");
  const dkey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => dkey(new Date());
  const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dkey(d); };
  const utc = (k) => { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
  const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (k, opts) => parse(k).toLocaleDateString("de-DE", opts);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const sel = (v, cur) => (v === cur ? " selected" : "");

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    sliders: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
    plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
    next: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
  };
  ICON.star = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>';
  ICON.pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z"/><path d="M12 15v6"/></svg>';
  // Bloom mark: five translucent petals around a solid centre with a check; colours follow the accent tokens.
  const LOGO = (size) => `<svg class="logo" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><g fill="var(--accent)">${
    [0, 72, 144, 216, 288].map((r) => `<ellipse cx="24" cy="13.5" rx="8.6" ry="9.4" opacity=".38" transform="rotate(${r} 24 24)"/>`).join("")
  }<circle cx="24" cy="24" r="8.5"/></g><path d="m20 24.2 2.8 2.8 5.4-5.6" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  document.querySelector(".logo-slot").innerHTML = LOGO(22);
  ICON.pencil = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>';
  // Inline rename for list items, subtasks, goal steps and habits: one item at a time, keyed "kind:id".
  const editing = (kind, id) => ui.editing === kind + ":" + id;
  const inlineEdit = (kind, id, value) => `<form class="inline-edit" data-form="edit" data-kind="${kind}" data-id="${id}">
      <input class="field" id="edit-input" name="text" value="${esc(value)}" autocomplete="off" enterkeyhint="done" required>
      <button class="btn small">Speichern</button><button type="button" class="btn small ghost" data-act="edit-cancel">Abbrechen</button>
    </form>`;
  const textCell = (kind, id, text) => editing(kind, id) ? inlineEdit(kind, id, text) : `<div class="body"><span class="title">${esc(text)}</span></div>`;
  const rowTools = (kind, id, text) => editing(kind, id) ? "" :
    `<button class="del" data-act="edit" data-kind="${kind}" data-id="${id}" aria-label="${esc(text)} bearbeiten">${ICON.pencil}</button>${delBtn(kind, id, text)}`;
  const REPEAT = { "": "Einmalig", daily: "Täglich", weekly: "Wöchentlich", monthly: "Monatlich" };
  const PRIO = { hoch: "Hoch", normal: "Normal", niedrig: "Niedrig" };
  const prioRank = (p) => ({ hoch: 0, niedrig: 2 }[p] ?? 1);
  const prioOptions = (cur) => Object.entries(PRIO).map(([k, l]) => `<option value="${k}"${sel(k, cur)}>${l}</option>`).join("");
  const isStar = (t) => !t.done && t.star === today();

  // Quick due-date picks; "week" means next Monday. target is "new" (add form) or a task id.
  const QUICK_DUE = [["Heute", 0], ["Morgen", 1], ["Übermorgen", 2], ["Nächste Woche", "week"], ["Kein Datum", ""]];
  function quickDate(v) {
    if (v === "") return "";
    const t = today();
    if (v === "week") return addDays(t, (8 - parse(t).getDay()) % 7 || 7);
    return addDays(t, Number(v));
  }
  const quickDue = (target, cur) => `<div class="quick" role="group" aria-label="Fällig am, Schnellauswahl">${QUICK_DUE.map(([l, v]) =>
    `<button type="button" class="chip" data-act="quick-due" data-target="${target}" data-v="${v}" aria-pressed="${quickDate(v) === cur}">${l}</button>`).join("")}</div>`;
  const markQuick = (box, cur) => box?.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(quickDate(c.dataset.v) === cur)));

  const checkBtn = (act, id, on, label, extra = "") =>
    `<button class="check ${extra}" data-act="${act}" data-id="${id}" aria-pressed="${on}" aria-label="${esc(label)}">${ICON.check}</button>`;
  const delBtn = (kind, id, label) => ui.arm === kind + ":" + id
    ? `<button class="del armed" data-act="del" data-kind="${kind}" data-id="${id}">Löschen</button>`
    : `<button class="del" data-act="arm" data-kind="${kind}" data-id="${id}" aria-label="${esc(label)} löschen">${ICON.x}</button>`;
  const bigDel = (kind, id, label) => ui.arm === kind + ":" + id
    ? `<button class="btn small danger-solid" data-act="del" data-kind="${kind}" data-id="${id}">Wirklich löschen</button>`
    : `<button class="btn small danger" data-act="arm" data-kind="${kind}" data-id="${id}">${label}</button>`;

  function dueTag(due) {
    if (!due) return "";
    const d = diffDays(today(), due);
    if (d < 0) return `<span class="tag late">Überfällig · ${fmt(due, { day: "numeric", month: "short" })}</span>`;
    if (d === 0) return `<span class="tag today">Heute</span>`;
    if (d === 1) return `<span class="tag">Morgen</span>`;
    return `<span class="tag">${fmt(due, { weekday: "short", day: "numeric", month: "short" })}</span>`;
  }

  // ---------- stats, XP, recurrence ----------
  function bump(day, key, n) {
    if (!day) return;
    const d = (S.stats[day] = S.stats[day] || {});
    d[key] = (d[key] || 0) + n;
    if (d[key] <= 0) delete d[key];
    if (!Object.keys(d).length) delete S.stats[day];
  }
  function totals() {
    const t = { t: 0, s: 0, m: 0, f: 0, fs: 0, h: 0 };
    for (const d of Object.values(S.stats)) for (const k in d) if (k in t) t[k] += d[k];
    for (const h of S.habits) t.h += Object.keys(h.log).length;
    return t;
  }
  const XP = { t: 10, s: 2, m: 15, fs: 20, h: 5 };
  const xpOf = (t) => t.t * XP.t + t.s * XP.s + t.m * XP.m + t.fs * XP.fs + t.h * XP.h;
  const levelStart = (L) => 50 * L * (L - 1);
  function level(xp) { let L = 1; while (levelStart(L + 1) <= xp) L++; return { L, from: levelStart(L), to: levelStart(L + 1) }; }

  function advance(t, from) {
    const d = parse(from);
    if (t.repeat === "daily") d.setDate(d.getDate() + 1);
    else if (t.repeat === "weekly") d.setDate(d.getDate() + 7);
    else if (t.repeat === "monthly") {
      const y = d.getFullYear(), m = d.getMonth() + 1;
      const ny = y + Math.floor(m / 12), nm = m % 12;
      return dkey(new Date(ny, nm, Math.min(t.repeatDay || d.getDate(), daysInMonth(ny, nm))));
    }
    return dkey(d);
  }
  function occursOn(t, day) {
    if (!t.due) return false;
    if (!t.repeat) return t.due === day;
    if (day < t.due) return false;
    if (t.repeat === "daily") return true;
    if (t.repeat === "weekly") return diffDays(t.due, day) % 7 === 0;
    const d = parse(day);
    return d.getDate() === Math.min(t.repeatDay || parse(t.due).getDate(), daysInMonth(d.getFullYear(), d.getMonth()));
  }

  // ---------- derived ----------
  const goalById = (id) => S.goals.find((g) => g.id === id);
  function goalProgress(g) {
    const linked = S.todos.filter((t) => t.goalId === g.id);
    const total = g.milestones.length + linked.length;
    const done = g.milestones.filter((m) => m.done).length + linked.filter((t) => t.done).length;
    return { total, done, pct: total ? Math.round((done / total) * 100) : 0, linked };
  }
  function streak(h) {
    let k = today();
    if (!h.log[k]) k = addDays(k, -1);
    let n = 0;
    while (h.log[k]) { n++; k = addDays(k, -1); }
    return n;
  }
  function bestStreak(h) {
    const days = Object.keys(h.log).sort();
    let best = 0, run = 0, prev = null;
    for (const d of days) { run = prev && diffDays(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
    return best;
  }
  const lastN = (h, n) => { let c = 0, k = today(); for (let i = 0; i < n; i++) { if (h.log[k]) c++; k = addDays(k, -1); } return c; };
  const sortTodos = (a, b) => {
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;
    return prioRank(a.priority) - prioRank(b.priority);
  };
  // Today's ring: habits for today, tasks due by today, and every task finished today (recurring ones included).
  function dayProgress() {
    const t = today();
    const doneToday = S.stats[t]?.t || 0;
    const openDue = S.todos.filter((x) => !x.done && x.due && x.due <= t).length;
    const total = S.habits.length + openDue + doneToday;
    if (!total) return 0;
    return (S.habits.filter((h) => h.log[t]).length + doneToday) / total;
  }

  // ---------- views: To-Dos ----------
  function briefing() {
    const t = today();
    try { if (localStorage.getItem(KEY + ":brief") === t) return ""; } catch {}
    const h = new Date().getHours();
    const hello = h < 11 ? "Guten Morgen" : h < 18 ? "Hallo" : "Guten Abend";
    const open = S.todos.filter((x) => !x.done);
    const dueToday = open.filter((x) => x.due === t).length;
    const late = open.filter((x) => x.due && x.due < t).length;
    const lines = [];
    lines.push(["Aufgaben", dueToday || late
      ? [dueToday && `${dueToday} heute fällig`, late && `${late} überfällig`].filter(Boolean).join(", ") + "."
      : open.length ? `Heute ist nichts fällig. ${plural(open.length, "Aufgabe ist", "Aufgaben sind")} offen.` : "Alles erledigt."]);
    const stars = open.filter(isStar);
    if (stars.length) lines.push(["Wichtig", stars.slice(0, 3).map((x) => x.title).join(", ") + (stars.length > 3 ? ` und ${stars.length - 3} weitere` : "") + "."]);
    if (S.habits.length) {
      const done = S.habits.filter((x) => x.log[t]).length;
      const top = [...S.habits].sort((a, b) => streak(b) - streak(a))[0];
      const s = streak(top);
      lines.push(["Habits", `${done} von ${S.habits.length} erledigt.` + (s >= 2 ? ` „${top.name}“ läuft seit ${s} Tagen.` : "")]);
    }
    const g = S.goals.filter((x) => x.deadline && goalProgress(x).pct < 100).sort((a, b) => (a.deadline < b.deadline ? -1 : 1))[0];
    if (g) {
      const d = diffDays(t, g.deadline);
      lines.push(["Ziel", `${g.title}: ${goalProgress(g).pct} %, ${d > 0 ? "noch " + plural(d, "Tag", "Tage") : d === 0 ? "heute fällig" : "Zieldatum überschritten"}.`]);
    }
    const fm = S.stats[t]?.f || 0;
    if (fm) lines.push(["Fokus", `${fm} Minuten heute.`]);
    return `<section class="card brief" aria-label="Tages-Briefing">
      <h2>${hello}.</h2>
      <ul>${lines.map(([k, v]) => `<li><b>${k}</b><span>${esc(v)}</span></li>`).join("")}</ul>
      <div class="actions"><button class="btn small" data-act="focus-open">Fokus starten</button><button class="btn small ghost" data-act="brief-hide">Für heute ausblenden</button></div>
    </section>`;
  }

      ${textCell("sub", s.id, s.text)}
      ${rowTools("sub", s.id, s.text)}
    </li>`).join("");
    return `<div class="detail">
      <label class="field-label">Titel<input class="field" id="edit-title-${x.id}" data-edit="title" data-id="${x.id}" value="${esc(x.title)}" autocomplete="off" enterkeyhint="done"></label>
      ${subs ? `<ul class="sub-rows">${subs}</ul>` : ""}
      <form class="add" data-form="sub" data-id="${x.id}">

        <button class="btn soft" aria-label="Unteraufgabe hinzufügen">${ICON.plus}</button>
      </form>
      <div class="opts">
        ${quickDue(x.id, x.due)}

        <label>Priorität<select class="field" id="edit-prio-${x.id}" data-edit="priority" data-id="${x.id}">${prioOptions(x.priority)}</select></label>
        <label>Ziel<select class="field" id="edit-goal-${x.id}" data-edit="goalId" data-id="${x.id}"><option value="">Kein Ziel</option>${goalOpts}</select></label>
      </div>
